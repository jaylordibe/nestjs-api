services:
  postgres:
    image: postgres:18.3
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --locale=C.UTF-8'
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.2
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the `s3` adapter is exercised against a real
  # backend rather than only constructed. That adapter is also the self-hosted
  # story (MinIO, Ceph) and the AWS/R2/Spaces story, so proving it proves the
  # broadest provider path — upload, signed read, delete.
  #
  # Ships in both stacks for the same reason Postgres and Redis do: a developer
  # running `STORAGE_PROVIDER=s3` locally should not need a cloud account, and
  # the e2e suite should not skip the one test that touches real object storage.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-minio
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - '${MINIO_PORT:-9000}:9000'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
