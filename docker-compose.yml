# Local development and e2e only — production uses docs/prod/docker-compose.yml,
# which publishes no data-service port at all. Ports bind to loopback so a
# laptop on a shared network does not offer its database, Redis or object
# storage (whose credentials fall back to a fixed local default) to that network.
services:
  postgres:
    image: postgres:18.3
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-postgres
    restart: unless-stopped
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --locale=C.UTF-8'
    ports:
      - '127.0.0.1:${DB_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6.2
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage, so the `s3` adapter is exercised against a real
  # backend rather than only constructed. That adapter is also the self-hosted
  # story (RustFS, MinIO, Ceph) and the AWS/R2/Spaces story, so proving it
  # proves the broadest provider path — upload, signed read, delete. RustFS,
  # because MinIO no longer publishes community container images.
  #
  # Ships in both stacks for the same reason Postgres and Redis do: a developer
  # running `STORAGE_PROVIDER=s3` locally should not need a cloud account, and
  # the e2e suite should not skip the one test that touches real object storage.
  s3:
    image: rustfs/rustfs:1.0.0
    container_name: ${SERVICE_NAME}${COMPOSE_STACK_SUFFIX:-}-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-s3admin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-s3admin-secret}
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  s3-data:
