name: Test

# Reusable + PR-triggered. Deploy workflows call this via `uses:` to gate
# merges; PR events trigger it directly against the target branch.
on:
  pull_request:
    branches:
      - main
      - staging
      - develop
  # Makes this workflow callable from other workflows as
  # `jobs.<name>.uses: ./.github/workflows/test.yml`. Needed by the
  # deploy-production / deploy-staging workflows that gate their deploys
  # on a passing test run. No `inputs` or `secrets` are declared, and no
  # `env:` either — all configuration comes from the committed `.env.test`
  # (see the note on the `ci` job).
  workflow_call:

# Cancel in-flight runs of this workflow for the same ref. Avoids two
# concurrent CI runs on rapid pushes; the newer commit wins.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default. Only read access to the repo. Individual jobs
# can escalate if they ever need to (e.g., to push images to GHCR).
permissions:
  contents: read

jobs:
  # Every job below is independent, with no `needs:` between them — the deploy
  # gate is bounded by the SLOWEST job, not by their sum. (Deliberately not
  # stated as a count: the previous "Four" outlived the fourth job by two.)
  #
  # This structure is deliberately sized for where a project GOES, not for
  # the handful of specs a fresh clone ships with. Retrofitting sharding into
  # a grown codebase means restructuring CI, re-measuring shard balance and
  # re-testing the harness under time pressure — once per project. Doing it
  # here means every project born from this template inherits a pipeline that
  # already scales, and the only knob anyone has to touch is the shard count.

  # Everything that needs no database.
  quality:
    name: Lint, build, unit tests
    runs-on: ubuntu-latest
    # ~2.5x a green run. A timeout is a runaway-job guard, NOT a capacity
    # knob: if it trips, something got stuck — find out what rather than
    # raising the number.
    timeout-minutes: 12

    # NO `services:` block and NO inline `env:` block anywhere in this file —
    # both are deliberate.
    #
    # `.env.test` is the SINGLE SOURCE OF TRUTH for test configuration, and
    # the e2e harness loads it directly (test/setup/load-env.ts +
    # global-setup.ts), in CI as much as locally. A job-level `env:` block
    # would silently SHADOW the file — `dotenv.config()` never overrides an
    # existing process.env value — so any key listed here becomes a second,
    # invisible source that drifts out of step with what developers run.
    #
    # Service containers can't fix that either: they start BEFORE checkout,
    # so their credentials can never be read from a repo file — they'd have
    # to be retyped, which is the same duplication one layer down. Instead
    # the backing services come from the very same docker-compose.yml
    # developers run, fed the very same .env.test, so ports, credentials,
    # images and healthchecks all have exactly one definition.

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --silent
        env:
          # Suppress Node's "DEP0169 url.parse" warning emitted by
          # yarn 1.x itself — yarn-internal, no upstream fix available.
          NODE_OPTIONS: --no-deprecation

      - name: Generate Prisma client
        run: yarn prisma:generate

      # `lint`, never `lint:fix`. `eslint --fix` exits 0 after rewriting
      # whatever it could repair — so a fixing linter in CI silently patches the
      # runner's copy, passes, and throws the fixes away with the container.
      # Formatting and every other auto-fixable rule would be enforced nowhere.
      # `scripts/build-config-contract.spec.ts` asserts this step stays honest.
      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Unit tests
        run: yarn test --passWithNoTests

      # The dependency audit used to run here. It now lives in
      # .github/workflows/security.yml, which adds a weekly cron: a PR-only
      # audit only ever learns about an advisory when someone next opens a pull
      # request, so a CVE disclosed against a dependency nobody is currently
      # touching goes unnoticed indefinitely. The deploy workflows call that
      # workflow alongside this one, so the gate still stands in front of every
      # deploy. The IMAGE scan stays here, in the `docker` job — it needs the
      # image that job builds.


  # The e2e suite, split across independent runners.
  #
  # Two levels of parallelism compose. WITHIN a runner, jest runs
  # `maxWorkers: 50%` processes, each against its own cloned database and its
  # own Redis logical database (see test/setup/worker-isolation.ts). ACROSS
  # runners, this matrix splits the spec files. A GitHub runner has 2 cores,
  # so 50% is 1 worker there and sharding does the real work in CI — the
  # in-runner parallelism is what keeps a developer's local full run fast.
  #
  # SHARD COUNT is the knob. `--shard` splits by FILE, not by duration, so
  # splits are lumpy and more shards is not monotonically better — a reshuffle
  # can regroup the slow specs and make things worse. Re-measure instead of
  # guessing when the suite grows:
  #
  #   for s in 1 2 3 4; do yarn test:e2e --shard=$s/4 --listTests; done
  #
  # then weigh the slowest shard against ~2 min of per-shard install + build
  # overhead. Four is a sane default here; a large suite may want more.
  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # If a shard ever trips this, add a shard — don't raise the ceiling.
    timeout-minutes: 15

    strategy:
      # One shard failing must not cancel the others: a partial result turns
      # "which tests are broken?" into a second CI round-trip.
      fail-fast: false
      # The divisor below is `strategy.job-total`, so changing this list is
      # the ONLY edit needed to re-shard — the two can never disagree.
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same compose file developers use, pointed at .env.test instead of
      # .env — so CI gets Postgres on DB_PORT and Redis on REDIS_PORT WITH the
      # same `--requirepass` auth, matching the URLs the tests will actually
      # dial. (A GitHub `services:` container cannot express `redis-server
      # --requirepass` at all — it accepts only docker-create options — which
      # is a second reason to use compose.) `--wait` blocks on the healthchecks
      # the compose file already defines.
      #
      # `yarn test:e2e` would start this itself via the `pretest:e2e` hook
      # (idempotent, so this is not a double-start); it stays an explicit step
      # so a failure to bring up the stack reads as a stack failure in the
      # logs rather than as a mysterious test failure.
      - name: Start Postgres + Redis from docker-compose.yml
        run: docker compose --env-file .env.test up -d --wait

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --silent
        env:
          # Suppress Node's "DEP0169 url.parse" warning emitted by
          # yarn 1.x itself — yarn-internal, no upstream fix available.
          NODE_OPTIONS: --no-deprecation

      # Needed for the generated client the specs import. Deliberately no
      # `yarn build`/`lint` here — ts-jest compiles the sources directly, and
      # `quality` already covers those in parallel.
      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: E2E tests
        run: yarn test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Container logs are the first thing you want when the failure is
      # "Postgres never came up" rather than "an assertion failed", and they
      # are gone the moment the runner is torn down.
      - name: Dump container logs on failure
        if: failure()
        run: docker compose --env-file .env.test logs --no-color --tail=200

  # The application refuses to boot when the permission catalog in the code
  # and the rows in the database disagree, so this runs on a throwaway
  # database rather than surfacing at deploy time when the healthcheck fails
  # and the old container is already stopped. Its own job because it needs a
  # database (so it can't live in `quality`) but has nothing to do with the
  # e2e specs (so it shouldn't ride on an arbitrary shard).
  authorization:
    name: Authorization catalog in sync
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Makes .env.test visible to every LATER step, not just the jest
      # processes that load it themselves — the authorization-catalog step
      # below is a plain shell step and needs the same credentials. `set -a`
      # exports each assignment; sourcing with bash also resolves the
      # `${SERVICE_NAME}`-style references the file uses (the same expansion
      # dotenv-expand does at runtime), so derived values land correctly.
      #
      # Nothing sensitive crosses a boundary here: every value in .env.test is
      # a committed test-only constant (throwaway container credentials, a
      # test JWT secret, blank third-party keys), which is precisely why the
      # file can be the shared source for laptops and CI alike. Real secrets
      # live in GitHub environments and are used by the deploy workflows.
      - name: Load .env.test into the job environment
        run: |
          set -a
          . ./.env.test
          set +a
          sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' .env.test |
            sort -u |
            while read -r key; do
              printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_ENV"
            done

      # The same compose file developers use, pointed at .env.test instead of
      # .env — so CI gets Postgres on DB_PORT and Redis on REDIS_PORT WITH the
      # same `--requirepass` auth, matching the URLs the tests will actually
      # dial. (A GitHub `services:` container cannot express `redis-server
      # --requirepass` at all — it accepts only docker-create options — which
      # is a second reason to use compose.) `--wait` blocks on the healthchecks
      # the compose file already defines.
      #
      # `yarn test:e2e` would start this itself via the `pretest:e2e` hook
      # (idempotent, so this is not a double-start); it stays an explicit step
      # so a failure to bring up the stack reads as a stack failure in the
      # logs rather than as a mysterious test failure.
      - name: Start Postgres + Redis from docker-compose.yml
        run: docker compose --env-file .env.test up -d --wait

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile --silent
        env:
          # Suppress Node's "DEP0169 url.parse" warning emitted by
          # yarn 1.x itself — yarn-internal, no upstream fix available.
          NODE_OPTIONS: --no-deprecation

      - name: Generate Prisma client
        run: yarn prisma:generate

      # Credentials/host/port come from .env.test (loaded above) — never
      # retyped here, or this step would drift from the stack it connects to.
      # Only the throwaway database NAME is local to this step, so the check
      # can't disturb the e2e databases on the same server.
      - name: Authorization catalog is in sync
        run: |
          RBAC_DB_NAME="${DB_NAME}_rbac_check"
          export DB_NAME="$RBAC_DB_NAME"
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${RBAC_DB_NAME}?schema=public"
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres \
            -c "DROP DATABASE IF EXISTS \"$RBAC_DB_NAME\";" \
            -c "CREATE DATABASE \"$RBAC_DB_NAME\";"
          yarn prisma:deploy
          yarn rbac:sync
          yarn rbac:check


  # Migrations meeting data that already exists — the one failure class every
  # other gate in this file is structurally blind to.
  #
  # `test/setup/global-setup.ts` issues DROP DATABASE / CREATE DATABASE on every
  # e2e run, so the suite only ever proves migrations apply to an EMPTY schema.
  # Production applies them to a populated one, and applies them BEFORE the new
  # container starts (deploy-production.yml runs `migrate` then `up -d`), so the
  # OLD build serves traffic against the NEW schema for the length of the swap.
  # Nothing tested that until this job. A DROP COLUMN, a SET NOT NULL, a RENAME,
  # or a unique index that collides with existing duplicates passes lint, build,
  # the e2e shards, Trivy and the entrypoint check, then fails in production with
  # the schema already changed and the old container already stopped.
  #
  # Runs in parallel with the other jobs (like `docker`) so it never lengthens
  # the deploy gate, and skips itself entirely when a change touches no
  # migration — which is most changes.
  migration-safety:
    name: Migrations against existing data
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # NO job-level `env:` block, for the same reason the `quality` job carries
    # none — and the failure mode here is especially sharp. `.env.test` already
    # pins `COMPOSE_PROJECT_NAME` (to `nestjs-test`), so compose resolves the
    # SAME project from `base/` and from `head/`; the working directory never
    # enters into it and there is nothing to pin.
    #
    # Restating `COMPOSE_PROJECT_NAME` here would break this job outright: the
    # steps that talk to the containers source `.env.test` with `set -a` first,
    # so a shell variable exported by a job-level block is OVERWRITTEN in
    # exactly those steps. `Start Postgres + Redis` (no sourcing) would create
    # one project, then `Assert the database is actually populated` (sourced)
    # would look in another and report `service "postgres" is not running`.
    #
    # So: any key `.env.test` defines must not be restated here, and every
    # `docker compose` invocation below runs from `head/` with that same file.

    steps:
      - name: Check out the proposed commit
        uses: actions/checkout@v7
        with:
          path: head

      # `main` is what production is actually running. Diffing against the PR's
      # base branch instead would miss anything already merged to develop but
      # not yet released — and it is the released schema these migrations will
      # really land on.
      - name: Check out the released commit
        uses: actions/checkout@v7
        with:
          ref: main
          path: base

      - name: Decide whether this change touches migrations
        id: scope
        run: |
          if diff -rq base/prisma/migrations head/prisma/migrations >/dev/null 2>&1; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'rebaselined=false' >> "$GITHUB_OUTPUT"
            echo 'No migration changes against the released commit — nothing for this job to prove.'
            exit 0
          fi

          echo 'changed=true' >> "$GITHUB_OUTPUT"
          echo 'Migration changes against the released commit:'
          diff -rq base/prisma/migrations head/prisma/migrations || true

          # A migration directory that exists on `main` and has been EDITED or
          # DELETED here is a template re-baseline, not an ordinary forward
          # migration. Detected by shape rather than by name, so it keeps
          # working whatever the baseline is called.
          #
          # It breaks the assertions below in two unavoidable ways, and both are
          # correct refusals for any other change: `migrate deploy` rejects an
          # edited migration outright, because its checksum is recorded in
          # `_prisma_migrations`; and the released build necessarily reads
          # tables the rewritten baseline may no longer create.
          #
          # So the comparison is skipped and replaced with a weaker but honest
          # one (below). This is only ever legitimate BEFORE a first deploy —
          # afterwards, re-baselining breaks `migrate deploy` in every
          # environment that has already run it.
          rebaselined=false
          for released in base/prisma/migrations/*/; do
            name="$(basename "$released")"
            proposed="head/prisma/migrations/$name"
            if [ ! -d "$proposed" ]; then
              echo "::warning::released migration '$name' has been DELETED"
              rebaselined=true
            elif ! diff -rq "$released" "$proposed" >/dev/null 2>&1; then
              echo "::warning::released migration '$name' has been EDITED"
              rebaselined=true
            fi
          done
          echo "rebaselined=$rebaselined" >> "$GITHUB_OUTPUT"

          if [ "$rebaselined" = 'true' ]; then
            echo '::warning::Template re-baseline detected. SKIPPING the populated-data and released-build assertions — an edited migration cannot be applied on top of itself, and the released build reads a schema that no longer exists. Proving the new baseline applies to an EMPTY database and seeds instead. This is safe ONLY because no environment has applied the old baseline; if one has, `migrate deploy` will refuse there.'
          fi

      # The same compose file and the same .env.test everything else uses, so
      # this job cannot drift onto its own database configuration.
      - name: Start Postgres + Redis
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: head
        run: docker compose --env-file .env.test up -d --wait postgres redis

      - name: Set up Node
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: head/yarn.lock

      - name: Install dependencies (released commit)
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: base
        run: yarn install --frozen-lockfile --silent
        env:
          NODE_OPTIONS: --no-deprecation

      # Recreates production's starting point: the released schema, carrying
      # rows. `.env.test` is sourced rather than restated in an `env:` block — a
      # workflow-level block would silently shadow the file. Any SEED_* value the
      # file does not define falls back below WITHOUT overriding one that it
      # does. `prisma/seed.ts` reads the ADMIN and USER prefixes and throws when
      # either pair is absent, so both are supplied.
      - name: Apply released migrations and seed data
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: base
        run: |
          set -euo pipefail
          set -a
          . ./.env.test
          : "${SEED_ADMIN_EMAIL:=migration-safety-admin@example.com}"
          : "${SEED_ADMIN_PASSWORD:=MigrationSafety123!}"
          : "${SEED_USER_EMAIL:=migration-safety-user@example.com}"
          : "${SEED_USER_PASSWORD:=MigrationSafety123!}"
          set +a
          yarn prisma:generate
          yarn prisma:deploy
          yarn prisma:seed

      # Without this the job could pass against an empty database and prove
      # nothing at all — the exact vacuous-green failure it exists to prevent.
      #
      # Runs from `head/` like every other compose call in this job, even
      # though it inspects the database the `base/` seed just filled: the two
      # checkouts share one Postgres container, and keeping a single directory
      # for `up`/`exec`/`logs` means the compose file being read is always the
      # one the stack was actually started from.
      - name: Assert the database is actually populated
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: head
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          row_count=$(docker compose --env-file .env.test exec -T postgres \
            psql -U "$DB_USER" -d "$DB_NAME" -tAc 'SELECT count(*) FROM users;')
          echo "users table holds ${row_count} row(s)"
          if [ "${row_count:-0}" -lt 1 ]; then
            echo '::error::seeding produced no rows, so applying migrations to a populated database was never actually tested'
            exit 1
          fi

      - name: Install dependencies (proposed commit)
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: head
        run: yarn install --frozen-lockfile --silent
        env:
          NODE_OPTIONS: --no-deprecation

      # The primary assertion: the NEW migrations applied on top of the released
      # schema, with real rows underneath them.
      - name: Apply the proposed migrations to the populated database
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: head
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          yarn prisma:generate
          if ! yarn prisma:deploy; then
            echo '::error::the proposed migrations do not apply to a database that already holds data — this would fail mid-deploy in production, after the old container has already been stopped'
            exit 1
          fi

      # The expand/contract assertion. Production runs the OLD image against the
      # NEW schema for the whole build-and-swap window, so a migration that
      # removes or tightens something the released code still reads takes the
      # site down before the new container ever starts.
      - name: Prove the released build still serves traffic on the new schema
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'false'
        working-directory: base
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          yarn build
          node dist/main.js &
          application_pid=$!
          trap 'kill "$application_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS "http://localhost:${PORT:-3000}/api/health/liveness" >/dev/null 2>&1; then
              echo "released build is healthy against the migrated schema (attempt ${attempt})"
              exit 0
            fi
            if ! kill -0 "$application_pid" 2>/dev/null; then
              echo '::error::the released build exited against the new schema — this migration is not backwards-compatible and will break production during the deploy window'
              exit 1
            fi
            sleep 2
          done

          echo '::error::the released build never became healthy against the new schema within 60s — treat this migration as not backwards-compatible'
          exit 1

      # The replacement assertion when the baseline was rewritten. Weaker than
      # the populated-data check above — deliberately so, and said out loud —
      # but it still catches invalid SQL, a constraint that cannot be created,
      # and a seeder the new schema no longer satisfies.
      - name: Prove the rewritten baseline applies to an empty database
        if: steps.scope.outputs.changed == 'true' && steps.scope.outputs.rebaselined == 'true'
        working-directory: head
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          BASELINE_DB_NAME="${DB_NAME}_baseline_check"
          export DB_NAME="$BASELINE_DB_NAME"
          export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${BASELINE_DB_NAME}?schema=public"
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres \
            -c "DROP DATABASE IF EXISTS \"$BASELINE_DB_NAME\";" \
            -c "CREATE DATABASE \"$BASELINE_DB_NAME\";"
          yarn install --frozen-lockfile --silent
          yarn prisma:generate
          if ! yarn prisma:deploy; then
            echo '::error::the rewritten baseline does not apply to an empty database'
            exit 1
          fi
          if ! yarn prisma:seed; then
            echo '::error::the rewritten baseline applies, but the seeder fails against it — a clone would boot into an unusable state'
            exit 1
          fi
          if ! yarn rbac:check; then
            echo '::error::the authorization catalog does not match the database the rewritten baseline produces'
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure() && steps.scope.outputs.changed == 'true'
        working-directory: head
        run: docker compose --env-file .env.test logs --no-color --tail=200

  docker:
    name: Build & scan container image
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `ci`. Gating appended its whole runtime to
    # every deploy; running it in parallel takes that off the critical path.
    # The cost is a wasted image build on runs where tests fail — a few cached
    # minutes, against minutes saved on every green deploy.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: nestjs-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scans the built image for CVEs in OS packages and node modules.
      # Fails on HIGH or CRITICAL; MEDIUM is reported but non-blocking.
      # `ignore-unfixed: true` skips CVEs with no available patch so the
      # build doesn't red-light on findings you literally cannot fix.
      #
      # The only exact-version `uses:` in this repo — everything else tracks a
      # moving major tag (`@v7`). Two reasons, both load-bearing: upstream
      # publishes no moving major tag at all (there is no `@v0`/`@v0.36`, only
      # `vX.Y.Z`), so an alias here would simply fail to resolve; and this is a
      # `composite` action, not a JavaScript one, so it has no Node runtime and
      # was untouched by the Node 20 deprecation that moved every other action
      # in these workflows. Bump it deliberately, not as part of a sweep.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nestjs-api:ci
          format: table
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          # Documented, dated risk acceptances (mirrors the source-side audit
          # allowlist in .github/scripts/audit-gate.mjs). Ships empty — an
          # entry here is the image-side half of the same last-resort decision.
          trivyignores: '.trivyignore'

      # Trivy above inspects the image's filesystem for CVEs; it never executes
      # anything, so an image whose entrypoint cannot resolve passes it cleanly.
      # That is a real failure mode: a `.ts` file entering the build scope
      # rebases the tsc rootDir, `yarn build` exits 0, the image builds, Trivy
      # passes, and the container crash-loops on deploy with MODULE_NOT_FOUND.
      #
      # Two checks against the image just built:
      #   1. That the runtime image contains the entrypoint and its assets —
      #      i.e. that Dockerfile's COPY landed. `postbuild` already asserted the
      #      full contract against this same dist/ during the build stage, so
      #      this is deliberately narrow.
      #   2. The real CMD, asserting its module graph resolves.
      #
      # What check 2 does NOT prove: boot. With no env, config validation throws
      # during module init, before onModuleInit reads anything — so asset
      # loading is covered by check 1 only. Saying otherwise would be the kind
      # of overclaim that lets a second failure hide behind the first.
      - name: Verify the built image can resolve what it runs
        run: |
          set -euo pipefail

          echo "::group::runtime image contents"
          docker run --rm --entrypoint node nestjs-api:ci -e "
            const { statSync } = require('node:fs');
            statSync('dist/main.js');
            statSync('dist/common/email/template-engine.js');
            statSync('dist/common/email/templates');
            console.log('runtime image contains the entrypoint and its assets');
          "
          echo "::endgroup::"

          # Foreground with a bounded timeout: the container exits on its own, so
          # there is nothing to poll for and no fixed sleep to get wrong. `|| true`
          # is NOT used on the capture — a docker failure must not be laundered
          # into an empty string that then passes the grep below.
          echo "::group::entrypoint resolves"
          set +e
          container_output=$(timeout 60 docker run --rm nestjs-api:ci 2>&1)
          set -e
          head -40 <<<"$container_output"
          echo "::endgroup::"

          # Positive control first. An absence-only assertion passes when the
          # container produced no output at all — i.e. when we never observed the
          # entrypoint run, which is precisely the case that must not pass.
          if [ -z "$container_output" ]; then
            echo "::error::the image produced no output; the entrypoint was never observed running"
            exit 1
          fi

          if grep -qE "Cannot find module|MODULE_NOT_FOUND" <<<"$container_output"; then
            echo "::error::the built image cannot resolve its entrypoint"
            exit 1
          fi
          echo "entrypoint module graph resolved; config errors above are expected without services"
