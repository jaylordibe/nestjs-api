name: Deploy to Staging

on:
  # Auto-deploy on pushes to the staging branch (typical GitFlow).
  push:
    branches:
      - staging
  # Manual re-deploy button in the Actions UI. Useful for retries
  # after transient infra failures without needing a new commit.
  workflow_dispatch:

# Serialize staging deploys so two pushes in quick succession don't
# race. `cancel-in-progress: false` — an in-flight deploy should
# finish, not be killed mid-flight. Newer pushes queue.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    # Calls the reusable workflow; deploy only runs if this passes.
    uses: ./.github/workflows/test.yml

  deploy:
    name: Deploy
    # Deploy is OPT-IN — see deploy-production.yml / docs/prod/README.md.
    # Enable by deleting this `if:` line (+ this comment) OR setting repo
    # variable DEPLOY_ENABLED=true, once the STAGING_* secrets are
    # provisioned; until then pushes run CI but skip the deploy.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # GitHub environment — lets you configure environment-scoped secrets
    # (STAGING_HOST, STAGING_USER, STAGING_SSH_KEY) and optionally require
    # reviewer approval via Settings → Environments → staging.
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    # The on-server project dir (`/srv/<service>`). Set as a variable in
    # Settings → Environments → staging (STAGING_SERVICE_DIR). Falls back
    # to /srv/nestjs (the template's default SERVICE_NAME) so a fresh
    # clone deploys without extra config.
    env:
      SERVICE_DIR: ${{ vars.STAGING_SERVICE_DIR || '/srv/nestjs' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # SSH material is written once at the start of the job; ~/.ssh persists
      # across `run` blocks within the same job and the runner is ephemeral, so
      # there is no cleanup to do.
      #
      # Host trust comes from a PINNED secret, never from the network. This step
      # used to run `ssh-keyscan` against the deploy host and trust whatever
      # answered — which is not host verification, it is a fresh
      # trust-on-first-use decision on every single run, made by a machine with
      # nobody watching. Anyone able to intercept the runner's first packet gets
      # the deploy: the private key is offered to them, and the deploy script
      # runs on their box.
      #
      # Agent forwarding is gone too. It existed so the VM could reuse the
      # runner's key to `git fetch` from GitHub, which meant ONE credential
      # authenticated the runner to the VM *and* the VM to source control, and
      # anyone with root on the VM could borrow it for the length of the deploy.
      # The VM now uses its own read-only deploy key — see docs/staging/README.md.
      - name: Configure SSH
        env:
          # Read through `env:` rather than interpolated into the script.
          # `${{ }}` is substituted before bash ever sees the line, so a secret
          # containing shell metacharacters would be executed, not quoted.
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          (umask 077; printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          (umask 077; printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)

          # Validate both, and say which one is wrong without printing either.
          # An empty or malformed known_hosts is the dangerous failure: ssh would
          # simply find no matching host key and refuse, which reads like a
          # network problem and invites somebody to "fix" it with a keyscan.
          if ! ssh-keygen -l -f ~/.ssh/known_hosts > /dev/null 2>&1; then
            echo "::error::STAGING_SSH_KNOWN_HOSTS is empty or not a valid known_hosts entry. Generate it on a trusted network with: ssh-keyscan -t ed25519 <host>"
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "::error::STAGING_SSH_KEY is not a valid unencrypted private key"
            exit 1
          fi
          echo "Pinned $(ssh-keygen -l -f ~/.ssh/known_hosts | wc -l) host key(s)"

      # Docker Compose deploy. Migrations run BEFORE `up -d` so the new code
      # never starts against an old schema; this assumes migrations are
      # backwards-compatible with the currently-running build (standard
      # expand/contract pattern). The `migrate` service uses the Dockerfile's
      # `build` target (has the prisma CLI); the `api` service uses the
      # pruned `runtime` target.
      #
      # Staging uses its own dedicated compose file + Caddyfile (NOT
      # docs/prod/) — staging keeps Swagger reachable behind Caddy Basic
      # Auth; prod hides it. The two are kept fully separate to avoid drift.
      - name: Deploy api to staging
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.STAGING_USER }}
          SERVICE_DIR: ${{ env.SERVICE_DIR }}
        run: |
          set -euo pipefail

          # SERVICE_DIR is a repository VARIABLE, not a secret: it is not masked,
          # and anyone who can edit repository settings can set it. It is then
          # embedded in a command that runs as the deploy user on the VM, so a
          # value containing a quote closes the quoting and appends whatever
          # follows. Validated as an absolute path of boring characters — which
          # excludes every shell metacharacter — rather than trusted.
          if ! printf '%s' "$SERVICE_DIR" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::STAGING_SERVICE_DIR must be an absolute path made of [A-Za-z0-9._/-]"
            exit 1
          fi
          case "$SERVICE_DIR" in
            *..*) echo "::error::STAGING_SERVICE_DIR must not contain '..'"; exit 1 ;;
          esac

          # No ssh config file and no agent: every option stated here, where it
          # can be read alongside the command it governs.
          #   IdentitiesOnly  — offer this key and nothing the agent might hold
          #   StrictHostKey…  — refuse an unrecognised host rather than learn it
          #   ForwardAgent=no — explicit, so re-adding it has to be deliberate
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ForwardAgent=no \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "${SSH_USER}@${SSH_HOST}" \
            "SERVICE_DIR='${SERVICE_DIR}'" bash -s <<'EOF'
            set -euo pipefail

            # API source dir is the api repo cloned next to the infra files.
            # Inferred from SERVICE_DIR's basename: /srv/nestjs → nestjs-api.
            SERVICE_NAME="$(basename "$SERVICE_DIR")"
            API_DIR="$SERVICE_DIR/$SERVICE_NAME-api"

            # Pull the latest API source. Hard-reset is safer than `git pull`
            # for unattended deploys — survives force-pushes and any drift.
            #
            # Authenticated by the VM'S OWN read-only deploy key, not by an
            # agent forwarded from the runner. If this fails with
            # "Permission denied (publickey)", that key is missing or not
            # registered on the repo — see docs/staging/README.md.
            cd "$API_DIR"
            if ! git fetch --prune origin staging; then
              echo "::error::git fetch failed on the server. The VM needs its own read-only deploy key (docs/staging/README.md); agent forwarding is deliberately disabled."
              exit 1
            fi
            git reset --hard origin/staging

            # Capture the deploy SHA and export it. GIT_SHA is forwarded as
            # a build arg to BOTH the migrate build and the api build (see
            # compose file). Both share a `build` Dockerfile stage; setting
            # GIT_SHA before either build means they hit the same RUN cache
            # entry and only rebuild once per commit.
            export GIT_SHA="$(git rev-parse HEAD)"
            echo "[deploy] deploying commit ${GIT_SHA}"

            # Sync the canonical infra files (tracked in docs/ in this repo)
            # into the project dir so server and repo never drift. -u skips
            # copies when contents are identical, keeping mtimes stable.
            cp -u docs/staging/docker-compose.yml "$SERVICE_DIR/docker-compose.yml"
            cp -u docs/staging/Caddyfile          "$SERVICE_DIR/Caddyfile"

            # All compose ops run from the project dir where docker-compose.yml
            # and the sibling source dirs (web) live.
            cd "$SERVICE_DIR"

            # Make sure data services are up before migrations.
            docker compose up -d postgres redis

            # Build + run the migration container. Idempotent. `< /dev/null`
            # is critical: without it the migrate container attaches to the
            # heredoc STDIN and slurps the rest of the script, so the api
            # never gets rebuilt and the workflow silently exits 0.
            docker compose --profile migrate run --rm --build migrate < /dev/null

            # Build + (re)start ONLY the api service. web is untouched
            # — it has its own deploy workflow. Three-step shape
            # (build, stop, swap) keeps the slow build off the downtime
            # window; `--wait` blocks until the api healthcheck passes.
            echo "[deploy] building api image (old container still serving traffic)…"
            docker compose build api
            echo "[deploy] stopping existing api container (if any)…"
            docker compose stop api || true
            echo "[deploy] starting new api container and waiting for healthcheck…"
            if ! docker compose up -d --force-recreate --wait api; then
              echo "::error::api container never went healthy after deploy"
              docker compose ps -a api
              docker compose logs --tail=200 api
              exit 1
            fi
            echo "[deploy] api container is healthy"

            # Make sure Caddy is running, then graceful-reload in case the
            # Caddyfile changed. `|| true` covers first deploy (no container
            # yet) and unchanged-config no-ops.
            docker compose up -d caddy
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true

            # Reclaim disk from previous deploys' dangling images.
            docker image prune -f
          EOF

      # Smoke test from the runner. Fails the deploy if the app doesn't come
      # up healthy within ~60s. STAGING_URL is set in the environment vars
      # (Settings → Environments → staging). Logs only on status-code
      # transitions so a stream of identical 502s doesn't flood the log.
      - name: Smoke test
        # Read through `env:`, not interpolated: STAGING_URL is a repository
        # variable and would otherwise be substituted into the shell before bash
        # parses the line.
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          last_code=""
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              "${STAGING_URL}/api/health/liveness" || echo curl_err)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)"
              exit 0
            fi
            if [ "$code" != "$last_code" ]; then
              echo "attempt ${attempt}: HTTP ${code}"
              last_code=$code
            fi
            sleep 2
          done
          echo "Health check failed after 60s — last status: HTTP ${last_code}"
          exit 1
